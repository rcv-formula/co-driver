# co_driver base settings - red_damvi (PPcontroller + gap_follow)
#
#   /drive_main  PPcontroller  map / raceline based; only meaningful while localization works
#   /drive_gf    gap_follow    reactive on /scan alone; unaffected by localization
#
# One line: **when localization collapses, hand over to gap_follow.**
# The confidence -> score mapping lives in config/co_driver_red_damvi_topics.jsonc.
#
# The stock config (co_driver.yaml) is untouched; this file is red_damvi only.
#
# All time values are in **ms** and the keys end in _ms (rates end in _hz).
/**:
  ros__parameters:
    use_sim_time: false

    # Topic list JSON. The launch file fills this in.
    topics_file: ""

    # =====================================================================
    # Output - the navigation input of ackermann_mux.
    #
    # gap_follow's own default drive_topic is also /drive, so it **must** be
    # overridden to /drive_gf (the launch file does this). Otherwise two nodes
    # publish to the same topic and the mux sees interleaved commands.
    # drive_monitor logs an ERROR if it ever sees two publishers here.
    # =====================================================================
    output:
      drive_topic: "/drive"
      frame_id: "base_link"
      rate_hz: 100.0
      publish_status: True

    evaluation:
      rate_hz: 50.0

    # =====================================================================
    # Score combination = one linear layer + softmax
    #   z_j = sum_i W[j][i] * phi_ji(x_i) + b_j
    #   p   = softmax(z / temperature)
    #
    # ema_alpha is a low pass on z, before the softmax. It is the first line of
    # defence against flapping, and it is what turns "confidence is below the
    # threshold" into "confidence has been below the threshold for a while".
    #
    # At evaluation 50 Hz, alpha 0.08 is a time constant of ~250 ms, which gives:
    #   confidence 0.99 -> 0.00 sustained : hands over after 0.46 s
    #   confidence 0.00 -> 0.99 sustained : hands back after 0.10 s (+ cooldown)
    #   a glitch to 0.0 lasting <= 400 ms : rejected, no switch at all
    # =====================================================================
    scoring:
      combine: "softmax"
      temperature: 1.0
      missing: "mask"
      ema_alpha: 0.08
      min_valid_score: 0.0

    # =====================================================================
    # Selection policy - second and third lines of defence against flapping.
    #
    #   switch_margin      a challenger must beat the incumbent's probability by
    #                      this much. That is the hysteresis. At 0.15 the actual
    #                      thresholds, in confidence terms, are:
    #                        pp_main -> gap_loc  when confidence falls below 0.171
    #                        gap_loc -> pp_main  when confidence rises above 0.226
    #                      Splitting the fallback into two candidates moved these
    #                      by less than 0.0005 - the third logit takes 0.24% of
    #                      the distribution when the path is clear - so the
    #                      calibration carries over unchanged.
    #                      0.171 .. 0.226 is a deadband where whatever is already
    #                      driving keeps driving.
    #   switch_cooldown_ms no second switch within this window, so gap_follow keeps
    #                      the car for at least this long once it has it.
    #
    #                      Note this gate is symmetric: it delays the handover *to*
    #                      gap_follow as much as the handover back. Raising it much
    #                      past 1.5 s therefore buys smoother behaviour at the cost of
    #                      reacting slower to a collapse, which is the wrong trade.
    #                      On the 0526-1 replay, 1.5 s delayed no handover at all
    #                      (the shortest gap between a recovery and the next collapse
    #                      was 2.42 s) while lifting the shortest dwell from 1.00 s to
    #                      1.52 s. 4.0 s would cut 13 switches to 9, but would also
    #                      have kept the car on a broken localization for 1.6 s longer
    #                      at t=63.5 s.
    #
    # switch_cooldown_ms is the DEFAULT. Each drive may override it with its own
    # keep_ms, and the red_damvi drives do: the fallback appears twice, once per
    # reason it can be chosen, because the two reasons want opposite dwell.
    # Leaving the map controller because localization failed should be sticky
    # (gap_loc, 1500 ms); leaving it to go round an object should end when the
    # object is behind the car (gap_obs, 400 ms). One number could not be both.
    #
    # fallback is gap_loc. "everything is disqualified" usually means localization
    # went with it, and the controller that only needs /scan is the last one worth
    # trusting.
    # =====================================================================
    selection:
      switch_margin: 0.15
      switch_cooldown_ms: 1500
      fallback: "gap_loc"

      # Last rung of the ladder: with EVERY drive failing a gate, drive the
      # freshest command still arriving rather than stopping the car.
      #
      # A gate says "not this drive", which presumes another one exists. On a
      # cold start none does - localization has never published, so the map
      # controller is gated out and the reactive one has nothing to react to
      # yet. Whichever controller is talking is the only thing there is, and
      # stopping is not safer than driving it.
      #
      # It cannot revive a dead topic: freshness is still required, so silence
      # from everything still takes the car down through timeout_stop. And a
      # drive selected this way does NOT become the incumbent, so gates that
      # exempt the incumbent stay shut on it - otherwise one such pick would
      # hold them open for the rest of the run. It hands the car back the
      # moment any drive passes its gates, and says so at WARN while it lasts.
      last_resort: true

    # =====================================================================
    # Ramp on return - tell the map controller when it has just been given
    # the car back, so it picks the speed up from where the car actually is.
    #
    # Coming back from the localization fallback, the plan can ask for a very
    # different speed than the one the car is carrying, and the controller has
    # no way to know a handover just happened: from its side nothing changed,
    # it was publishing all along. This publishes true on its launch-start
    # topic at that moment, and the controller ramps from the measured wheel
    # speed at its own acceleration instead of stepping to the plan.
    #
    # It decides for itself whether the ramp is needed - if the speed is
    # already within launch_start_engage_diff of the target it skips and says
    # so - which is why this can fire unconditionally on the edge.
    #
    # `from` is what counts as a return, and it is the edge ALL THREE of the
    # hand-back actions hang off - the speed hold, this flag, and the gain
    # assist in return_assist.jsonc. Adding a name here adds it to all of them.
    #
    # Both candidates. They are the same controller under two names, and the
    # car comes off it in the same state either way; which reason took it away
    # does not change what it needs on the way back.
    #
    # An empty topic disables the flag only - the other two are unaffected.
    # =====================================================================
    # NOTE: return_assist.jsonc can turn on a speed hold, which does the ramp
    # itself once it releases. While that is on, this flag is NOT sent - the
    # controller takes the most recent of the two as the winner, so sending it
    # would cancel the hold. Nothing here needs changing for that; it is said
    # at startup which of the two is in use.
    ramp_on_return:
      topic: "/launch_start_reset"
      from: ["gap_loc", "gap_obs"]
      to: "pp_main"

      # Below this commanded speed the selection is frozen. A stopped car is not
      # driving anywhere, so a handover achieves nothing and protects against
      # nothing - whatever holds the car is commanding a standstill either way.
      # What it does remove is churn: localization cannot discriminate its
      # position without motion, so the state wanders Lost/Converging while the
      # car sits and the map controller is disqualified and released over and
      # over. Measured across 71 s of standstill in the 0814 recording, that was
      # 12.9% of samples. The freeze lifts on the first cycle the car moves, and
      # never holds a drive whose command has gone stale.
      freeze_below_speed: 0.15

    # =====================================================================
    # Post-processing - the pipeline list is the order of application.
    # =====================================================================
    postprocess:
      pipeline: ["timeout_stop", "switch_blend", "rate_limit", "speed_scale", "deadband", "clamp"]

      timeout_stop:
        decel: 12.0
        hold_steer: True

      # PPcontroller and gap_follow can disagree sharply on steering, so blend for
      # longer than the stock 250 ms.
      switch_blend:
        duration_ms: 300.0
        curve: "smooth"
        ema_alpha: 0.2

      # Kept consistent with gap_follow's own max_acceleration 6.0 / max_deceleration 6.0.
      rate_limit:
        max_steer_rate_deg: 400.0
        max_accel: 6.0
        max_decel: 12.0

      speed_scale:
        scale: 1.0

      deadband:
        speed: 0.05
        steer_deg: 0.3

      clamp:
        max_steering_deg: 50.0
        max_speed: 8.0
        min_speed: 0.0
