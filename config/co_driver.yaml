# co_driver 기본 설정.
#
# 개수가 고정된 설정은 전부 여기(yaml)에 있고, 계속 늘어나는 목록 —
# 입력 토픽(inputs)과 /drive 토픽(drives), 그리고 둘 사이의 영향 행렬 — 만
# topics_file 이 가리키는 JSON 에 있습니다.
#
#   yaml : output / evaluation / scoring / selection / postprocess
#   json : inputs[] / drives[]        <- 토픽을 추가할 때 여기만 건드립니다
#
# 시간 값은 전부 **ms** 단위이고 키 이름이 _ms 로 끝납니다 (주파수는 _hz).
#
# 센서 토픽(scan/map/imu/odom 등)은 여기에 없습니다. 그것들을 보고 판단하는 일은
# 각 채점기(src/scorers/)가 자기 구독자로 직접 하고, 필요한 토픽 이름은
# 토픽 목록 JSON 의 inputs[].params 에 적습니다.
#
# 최상위 키는 와일드카드 `/**` 입니다. 네임스페이스를 붙이거나 노드 이름을 바꿔도
# 파일이 조용히 무시되지 않습니다.
/**:
  ros__parameters:
    use_sim_time: false

    # 입력/드라이브 토픽 목록 JSON. launch 가 채워 줍니다.
    # 직접 실행할 때는 절대 경로를 적으세요.
    topics_file: ""

    # =====================================================================
    # 출력 — ackermann_mux 의 navigation 입력(f1tenth_stack mux.yaml 의 "drive").
    # 여기로 보내야 조이스틱(priority 100) 오버라이드와 mux timeout 이 살아 있습니다.
    # =====================================================================
    output:
      drive_topic: "/drive"
      frame_id: "base_link"
      rate_hz: 100.0
      publish_status: True

    evaluation:
      # 채점은 출력보다 느려도 됩니다. 무거운 채점기를 붙였으면 여기를 낮추세요.
      rate_hz: 50.0

    # 모든 (드라이브 × 입력) 쌍의 기본 influence 를 여기서 한 번에 바꿀 수 있습니다.
    # 적지 않으면 내장 기본값(weight 0, 순수 선형)이 쓰이므로 보통은 생략합니다.
    # defaults:
    #   influence: {weight: 0.0, exp_mix: 0.0, exp_k: 3.0}

    # =====================================================================
    # 점수 결합 = 1층 선형 MLP + softmax
    #
    #   z_j = Σ_i W[j][i]·φ_ji(x_i) + b_j   W = influence.weight, b = drives[].bias
    #   p   = softmax(z / temperature)
    #
    # W 는 음수를 써도 됩니다(감점 항).
    #   temperature : 낮을수록 승자독식(전환 민감), 높을수록 평탄(둔감)
    #   missing     : 판단 불가 입력 처리. "mask"=남은 항으로 되스케일(권장),
    #                                      "zero"=φ=0 으로 그대로 더함(순수 MLP)
    #   ema_alpha   : softmax 이전 z 에 걸리는 저역통과. 1.0 = 필터 없음
    #
    # softmax 대신 정규화 가중평균도 가능(이 경우 음수 가중치는 0 취급):
    #   combine: "weighted_sum"
    # =====================================================================
    scoring:
      combine: "softmax"
      temperature: 1.0
      missing: "mask"
      ema_alpha: 0.4
      min_valid_score: 0.0

    # =====================================================================
    # 선택 정책
    # combine: softmax 에서는 score 가 확률이므로 switch_margin 도 "확률 차이" 입니다.
    # (드라이브 N개면 균등 상태가 1/N 이라는 점을 기준으로 잡으세요)
    # =====================================================================
    selection:
      switch_margin: 0.10
      switch_cooldown_ms: 500    # 전환 직후 이 시간 동안은 다시 전환하지 않음
      fallback: "pp_main"        # 전원 실격일 때 마지막 시도. JSON drives 의 이름

    # =====================================================================
    # 후처리 — pipeline 목록의 순서가 곧 적용 순서입니다.
    # 단계를 빼려면 목록에서 지우고, 같은 타입을 여러 번 쓰려면 이름을 다르게 준 뒤
    # 그 블록에 type 을 명시하세요.
    #
    # 주의: 후처리를 전부 끄려면 postprocess 블록을 통째로 지우세요.
    #       `pipeline: []` 처럼 빈 리스트를 쓰면 ROS 파라미터에 타입이 없어
    #       노드가 기동하지 못합니다(yaml 전반에 해당).
    # =====================================================================
    postprocess:
      pipeline: ["timeout_stop", "switch_blend", "rate_limit", "speed_scale", "deadband", "clamp"]

      # 쓸 드라이브가 없을 때 안전 정지. 맨 앞에 두어 감속 명령이 뒤 단계를 통과하게 함
      timeout_stop:
        decel: 12.0          # m/s^2. 0 이하면 즉시 0
        hold_steer: True

      # 드라이브 전환 순간의 점프를 녹임
      switch_blend:
        duration_ms: 250.0   # 블렌딩 길이
        curve: "smooth"      # linear | smooth | ema
        ema_alpha: 0.2       # curve: ema 일 때만 사용

      rate_limit:
        max_steer_rate_deg: 400.0
        max_accel: 6.0
        max_decel: 12.0

      # 런타임: ros2 param set /co_driver_node postprocess.speed_scale.scale 0.5
      speed_scale:
        scale: 1.0

      deadband:
        speed: 0.05
        steer_deg: 0.3

      # 절대 한계. 마지막에 두어 앞 단계가 한계를 넘기지 못하게 함
      clamp:
        max_steering_deg: 50.0   # PPcontroller 의 steering_limit 와 맞춤
        max_speed: 8.0
        min_speed: 0.0           # 후진 금지. 후진을 쓰려면 음수로
